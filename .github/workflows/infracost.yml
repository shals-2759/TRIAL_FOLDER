name: Infracost Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Check secret exists
        run: |
          if [ -z "${{ secrets.INFRACOST_API_KEY }}" ]; then
            echo "API KEY IS EMPTY"
            exit 1
          else
            echo "API KEY EXISTS"
          fi

      - name: Run Infracost Diff
        uses: infracost/actions/diff@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: ./base
          head-path: ./head
        
      - name: Check event
        run: |
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Repository: ${{ github.repository }}"
          echo "Owner: ${{ github.repository_owner }}"