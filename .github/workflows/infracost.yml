name: Infracost Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      # ADD THIS STEP to catch missing secret early
      - name: Check secret exists
        run: |
          if [ -z "${{ secrets.INFRACOST_API_KEY }}" ]; then
            echo "::error::INFRACOST_API_KEY secret is missing or empty!"
            exit 1
          else
            echo "Secret is present."
          fi

      - name: Run Infracost Diff
        uses: infracost/actions/diff@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: ./base
          head-path: ./head