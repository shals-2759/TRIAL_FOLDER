name: Infracost 

on:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    runs-on: ubuntu-latest
    name: Cost estimate

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate baseline cost estimate
        run: |
          infracost breakdown \
            --path=./base \
            --format=json \
            --out-file=/tmp/infracost-base.json

      - name: Generate PR cost estimate
        run: |
          infracost breakdown \
            --path=./head \
            --format=json \
            --out-file=/tmp/infracost-head.json

      - name: Post Infracost comment
        run: |
          # Generate diff output as text
          infracost diff \
            --path=/tmp/infracost-head.json \
            --compare-to=/tmp/infracost-base.json \
            --format=diff \
            --out-file=/tmp/infracost-comment.txt

          # Post as PR comment
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$(cat /tmp/infracost-comment.txt)" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}