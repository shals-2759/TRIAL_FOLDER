name: Infracost Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - name: Run Infracost Diff
        uses: infracost/actions/diff@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: ./base
          head-path: ./head