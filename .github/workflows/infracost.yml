name: Infracost
on:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    runs-on: ubuntu-latest
    name: Cost estimate

    steps:
      # Checkout BASE branch first and generate its cost
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost JSON (base branch)
        run: |
          infracost breakdown \
            --path=. \
            --format=json \
            --out-file=/tmp/infracost-base.json

      # Then checkout PR branch and generate its cost
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Generate Infracost JSON (PR branch)
        run: |
          infracost breakdown \
            --path=. \
            --format=json \
            --out-file=/tmp/infracost-pr.json

      # Post the diff comment
      - name: Post cost diff comment on PR
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost-pr.json
          compare-to: /tmp/infracost-base.json
          behavior: update
          github-token: ${{ secrets.GITHUB_TOKEN }}